name: Hermes + 9Router

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-9router-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      STATE_PASSWORD: ${{ secrets.STATE_PASSWORD }}
      RUNTIME_ROOT: ${{ github.workspace }}/.runtime
      LIVE_ROOT: ${{ github.workspace }}/.runtime/live
      WORKSPACE_ROOT: ${{ github.workspace }}/.runtime/live/hermes/workspace
      CACHE_ROOT: ${{ github.workspace }}/.runtime/cache
      CONTROL_PORT: "18080"
      NINEROUTER_PORT: "20128"
      HERMES_DASHBOARD_PORT: "9119"
      TOTAL_MINUTES: "300"
      SETUP_TIMEOUT_SECONDS: "1200"
      NINEROUTER_IMAGE: "ghcr.io/decolua/9router:0.5.91@sha256:1d0fc80ee37b93a0165c9b88a87a414c3faebf44d6c1e580250d35a610b3061a"
      HERMES_IMAGE: "nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7"
      CLOUDFLARED_VERSION: "2026.9.3"
      CLOUDFLARED_SHA256: "ea2c9bb2d5017a796b64bf36e605d727accf76a5500014bb12952ce11ae1f932"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore latest encrypted state cache
        uses: actions/cache/restore@v4
        with:
          path: .runtime/cache
          key: hermes-9router-state-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            hermes-9router-state-${{ github.repository_id }}-

      - name: Prepare runtime and restore encrypted state
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "${STATE_PASSWORD:-}" || {
            echo 'ERROR: GitHub Secret STATE_PASSWORD is missing.' >&2
            exit 1
          }

          case "$STATE_PASSWORD" in
            *$'\n'*|*$'\r'*)
              echo 'ERROR: STATE_PASSWORD must be a single-line secret.' >&2
              exit 1
              ;;
          esac
          [ "${#STATE_PASSWORD}" -ge 20 ] || {
            echo 'ERROR: STATE_PASSWORD must be at least 20 characters.' >&2
            exit 1
          }

          rm -rf "$LIVE_ROOT" "$RUNTIME_ROOT/bin" "$RUNTIME_ROOT/control" "$RUNTIME_ROOT/logs"
          mkdir -p "$LIVE_ROOT/9router" "$LIVE_ROOT/hermes/workspace" "$CACHE_ROOT"

          if [ -f "$CACHE_ROOT/state.enc" ]; then
            echo 'Encrypted state found; decrypting...'
            tmp_tar="$RUNTIME_ROOT/state.tar"
            if ! openssl enc -d -aes-256-cbc -pbkdf2 \
                -in "$CACHE_ROOT/state.enc" \
                -out "$tmp_tar" \
                -pass env:STATE_PASSWORD; then
              echo 'ERROR: STATE_PASSWORD does not match the saved state.' >&2
              rm -f "$tmp_tar"
              exit 1
            fi
            tar -xpf "$tmp_tar" -C "$LIVE_ROOT" --no-same-owner --no-overwrite-dir
            rm -f "$tmp_tar"
          else
            echo 'No previous state found; entering guided first setup.'
          fi

          chmod 700 "$LIVE_ROOT" "$LIVE_ROOT/9router" "$LIVE_ROOT/hermes"
          chmod 700 "$LIVE_ROOT/hermes/workspace"

      - name: Main runtime
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${STATE_PASSWORD:?STATE_PASSWORD is required}"

          mkdir -p "$RUNTIME_ROOT/bin" "$RUNTIME_ROOT/control" "$RUNTIME_ROOT/logs"
          CONTROL_DIR="$RUNTIME_ROOT/control"
          CONTROL_SCRIPT="$RUNTIME_ROOT/bin/control_server.py"
          CONTROL_STAGE="$CONTROL_DIR/stage"
          CONTROL_CONTINUE="$CONTROL_DIR/continue-9router"
          CONTROL_START="$CONTROL_DIR/start-hermes"
          CONTROL_KEY="$CONTROL_DIR/ninerouter-api-key"
          CONTROL_KEY_VALID="$CONTROL_DIR/ninerouter-api-key.valid"
          CONTROL_KEY_ERROR="$CONTROL_DIR/ninerouter-api-key.error"

          cat > "$CONTROL_SCRIPT" <<'PY'
          import base64
          import hmac
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request
          from http import HTTPStatus
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import parse_qs

          ROOT = pathlib.Path(os.environ["CONTROL_DIR"])
          STAGE_FILE = ROOT / "stage"
          CONTINUE_FILE = ROOT / "continue-9router"
          START_FILE = ROOT / "start-hermes"
          KEY_FILE = ROOT / "ninerouter-api-key"
          KEY_VALID_FILE = ROOT / "ninerouter-api-key.valid"
          KEY_ERROR_FILE = ROOT / "ninerouter-api-key.error"
          PASSWORD = os.environ["CONTROL_PASSWORD"]
          USERNAME = "admin"
          NINEROUTER_PORT = int(os.environ.get("NINEROUTER_PORT", "20128"))

          def stage():
              try:
                  return STAGE_FILE.read_text(encoding="utf-8").strip()
              except FileNotFoundError:
                  return "starting"

          def read_text(path: pathlib.Path, default=""):
              try:
                  return path.read_text(encoding="utf-8")
              except FileNotFoundError:
                  return default

          def authorized(header: str | None) -> bool:
              if not header or not header.startswith("Basic "):
                  return False
              try:
                  raw = base64.b64decode(header[6:], validate=True).decode("utf-8")
                  user, password = raw.split(":", 1)
              except Exception:
                  return False
              return hmac.compare_digest(user, USERNAME) and hmac.compare_digest(password, PASSWORD)

          def atomically_write(path: pathlib.Path, value: str):
              tmp = path.with_suffix(path.suffix + ".tmp")
              fd = os.open(tmp, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      f.write(value)
                      f.flush()
                      os.fsync(f.fileno())
                  os.replace(tmp, path)
                  dir_fd = os.open(str(path.parent), os.O_RDONLY)
                  try:
                      os.fsync(dir_fd)
                  finally:
                      os.close(dir_fd)
              finally:
                  try:
                      tmp.unlink()
                  except FileNotFoundError:
                      pass

          def validate_api_key(api_key: str) -> tuple[bool, str]:
              authenticated = urllib.request.Request(
                  f"http://127.0.0.1:{NINEROUTER_PORT}/v1/models",
                  headers={"Authorization": f"Bearer {api_key}", "Accept": "application/json"},
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(authenticated, timeout=12) as response:
                      if response.status != 200:
                          return False, f"9Router returned HTTP {response.status}."
                      body = response.read(1024 * 1024)
                      if b'"data"' not in body:
                          return False, "9Router returned an unexpected /v1/models response."
              except urllib.error.HTTPError as exc:
                  if exc.code == 401:
                      return False, "API key rejected by 9Router (401 Unauthorized)."
                  return False, f"9Router returned HTTP {exc.code}."
              except Exception as exc:
                  return False, f"Could not validate the API key: {exc.__class__.__name__}."

              # The public Quick Tunnel exposes the whole 9Router port. Refuse to
              # proceed until /v1 requires Bearer authentication even without the key.
              unauthenticated = urllib.request.Request(
                  f"http://127.0.0.1:{NINEROUTER_PORT}/v1/models",
                  headers={"Accept": "application/json"},
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(unauthenticated, timeout=12) as response:
                      if response.status == 200:
                          return False, "9Router /v1 is reachable without a Bearer API key. Enable API-key enforcement in the 9Router Dashboard and try again."
                      return False, f"9Router returned unexpected HTTP {response.status} without authentication."
              except urllib.error.HTTPError as exc:
                  if exc.code == 401:
                      return True, "API key accepted and /v1 authentication is enforced."
                  return False, f"9Router returned HTTP {exc.code} without authentication; expected 401."
              except Exception as exc:
                  return False, f"Could not verify 9Router API-key enforcement: {exc.__class__.__name__}."

          def html(title: str, body: str) -> bytes:
              return f"""<!doctype html>
          <html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
          <title>{title}</title>
          <style>body{{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 18px;line-height:1.5}}button{{font-size:18px;padding:12px 18px;border:0;border-radius:10px;cursor:pointer}}input{{width:100%;box-sizing:border-box;font:16px monospace;padding:12px;border:1px solid #ccc;border-radius:10px;margin:10px 0 16px}}.box{{padding:20px;border:1px solid #ddd;border-radius:14px}}.ok{{color:#087f23}}.err{{color:#b00020}}</style></head>
          <body><div class='box'>{body}</div></body></html>""".encode("utf-8")

          class Handler(BaseHTTPRequestHandler):
              server_version = "Hermes9RouterControl/3.0"

              def log_message(self, fmt, *args):
                  return

              def send(self, status: int, content: bytes, content_type="text/html; charset=utf-8"):
                  self.send_response(status)
                  self.send_header("Content-Type", content_type)
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("Content-Length", str(len(content)))
                  self.end_headers()
                  self.wfile.write(content)

              def require_auth(self) -> bool:
                  if authorized(self.headers.get("Authorization")):
                      return True
                  self.send_response(HTTPStatus.UNAUTHORIZED)
                  self.send_header("WWW-Authenticate", 'Basic realm="Hermes + 9Router"')
                  self.send_header("Content-Length", "0")
                  self.end_headers()
                  return False

              def do_GET(self):
                  if self.path == "/health":
                      self.send(HTTPStatus.OK, b'{"ok":true}', "application/json")
                      return
                  if not self.require_auth():
                      return

                  current = stage()
                  key_valid = KEY_VALID_FILE.exists()
                  key_error = read_text(KEY_ERROR_FILE).strip()

                  if current == "9router":
                      if key_valid:
                          body = """
                          <h1>9Router setup completed?</h1>
                          <p class='ok'>9Router API key validated successfully.</p>
                          <p>حالا تنظیمات Provider و Modelها را در 9Router کامل کنید.</p>
                          <form method='POST' action='/continue-9router'><button>Continue to Hermes setup</button></form>
                          """
                      else:
                          error_html = f"<p class='err'><b>{key_error}</b></p>" if key_error else ""
                          body = f"""
                          <h1>9Router setup</h1>
                          <p>در Dashboard 9Router از مسیر <b>Settings → API Keys</b> یک API Key بسازید، سپس همین‌جا وارد کنید.</p>
                          {error_html}
                          <form method='POST' action='/save-9router-key'>
                            <label for='api_key'>9Router API Key</label>
                            <input id='api_key' name='api_key' type='password' autocomplete='off' required>
                            <button>Validate API Key</button>
                          </form>
                          """
                  elif current == "hermes":
                      body = """
                      <h1>Hermes setup completed?</h1>
                      <p>در Dashboard هرمس مدل 9Router، Telegram و هر credential/tool موردنیاز را تنظیم کنید.</p>
                      <form method='POST' action='/start-hermes'><button>Start Hermes Agent</button></form>
                      """
                  elif current == "running":
                      body = "<h1>Both services are running</h1><p>Hermes و 9Router فعال هستند.</p>"
                  else:
                      body = "<h1>Starting...</h1><p>چند لحظه بعد صفحه را Refresh کنید.</p>"
                  self.send(HTTPStatus.OK, html("Hermes + 9Router", body))

              def do_POST(self):
                  if not self.require_auth():
                      return
                  length = int(self.headers.get("Content-Length", "0"))
                  if length > 16384:
                      self.send(HTTPStatus.REQUEST_ENTITY_TOO_LARGE, html("Too large", "<h1>Request too large</h1>"))
                      return
                  raw = self.rfile.read(length) if length else b""

                  if self.path == "/save-9router-key" and stage() == "9router":
                      try:
                          form = parse_qs(raw.decode("utf-8"), keep_blank_values=True)
                      except Exception:
                          self.send(HTTPStatus.BAD_REQUEST, html("Invalid request", "<h1>Invalid form data</h1>"))
                          return
                      api_key = (form.get("api_key") or [""])[0].strip()
                      if not api_key or "\n" in api_key or "\r" in api_key or any(ch.isspace() for ch in api_key):
                          atomically_write(KEY_ERROR_FILE, "API key is empty or contains whitespace/newlines.")
                          KEY_VALID_FILE.unlink(missing_ok=True)
                          self.send(HTTPStatus.BAD_REQUEST, html("Invalid API key", "<h1>Invalid API key</h1><p>کلید نباید خالی باشد یا whitespace/newline داشته باشد.</p>"))
                          return

                      atomically_write(KEY_FILE, api_key)
                      KEY_ERROR_FILE.unlink(missing_ok=True)
                      ok, message = validate_api_key(api_key)
                      if ok:
                          atomically_write(KEY_VALID_FILE, "valid")
                          self.send(HTTPStatus.OK, html("Validated", "<h1 class='ok'>API Key validated</h1><p>کلید 9Router معتبر است. حالا تنظیمات Provider/Model را کامل کنید و Continue را بزنید.</p><p><a href='/'>Back</a></p>"))
                      else:
                          KEY_VALID_FILE.unlink(missing_ok=True)
                          KEY_FILE.unlink(missing_ok=True)
                          atomically_write(KEY_ERROR_FILE, message)
                          self.send(HTTPStatus.UNAUTHORIZED, html("Rejected", f"<h1 class='err'>API Key rejected</h1><p>{message}</p><p><a href='/'>Try again</a></p>"))
                      return

                  if self.path == "/continue-9router" and stage() == "9router" and KEY_VALID_FILE.exists():
                      atomically_write(CONTINUE_FILE, str(int(time.time())))
                      self.send(HTTPStatus.OK, html("Registered", "<h1>ثبت شد</h1><p>Workflow وارد مرحله Hermes می‌شود.</p>"))
                      return

                  if self.path == "/start-hermes" and stage() == "hermes":
                      atomically_write(START_FILE, str(int(time.time())))
                      self.send(HTTPStatus.OK, html("Registered", "<h1>ثبت شد</h1><p>Hermes Agent شروع می‌شود.</p>"))
                      return

                  self.send(HTTPStatus.CONFLICT, html("Invalid state", "<h1>مرحله نامعتبر</h1>"))

          server = ThreadingHTTPServer(("127.0.0.1", int(os.environ.get("CONTROL_PORT", "18080"))), Handler)
          server.daemon_threads = True
          print(f"control-server listening on 127.0.0.1:{server.server_address[1]}", flush=True)
          server.serve_forever()
          PY

          export CONTROL_DIR CONTROL_PASSWORD="$STATE_PASSWORD" CONTROL_PORT NINEROUTER_PORT
          nohup python3 "$CONTROL_SCRIPT" > "$RUNTIME_ROOT/logs/control.log" 2>&1 &
          echo $! > "$RUNTIME_ROOT/control.pid"

          cleanup() {
            set +e
            if [ -f "$RUNTIME_ROOT/cloudflared-9router.pid" ]; then kill "$(cat "$RUNTIME_ROOT/cloudflared-9router.pid")" 2>/dev/null || true; fi
            if [ -f "$RUNTIME_ROOT/cloudflared-hermes.pid" ]; then kill "$(cat "$RUNTIME_ROOT/cloudflared-hermes.pid")" 2>/dev/null || true; fi
            if [ -f "$RUNTIME_ROOT/cloudflared-control.pid" ]; then kill "$(cat "$RUNTIME_ROOT/cloudflared-control.pid")" 2>/dev/null || true; fi
            docker rm -f hermes-dashboard 2>/dev/null || true
            docker rm -f hermes-gateway 2>/dev/null || true
            docker rm -f hermes 2>/dev/null || true
            docker rm -f 9router 2>/dev/null || true
            if [ -f "$RUNTIME_ROOT/control.pid" ]; then kill "$(cat "$RUNTIME_ROOT/control.pid")" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          # Stable technical secrets derived from the single user-managed secret.
          JWT_SECRET="$(printf '9router-jwt:%s' "$STATE_PASSWORD" | sha256sum | awk '{print $1}')"
          API_KEY_SECRET="$(printf '9router-api:%s' "$STATE_PASSWORD" | sha256sum | awk '{print $1}')"
          MACHINE_ID_SALT="$(printf '9router-machine:%s' "$STATE_PASSWORD" | sha256sum | awk '{print $1}')"
          HERMES_AUTH_SECRET="$(printf 'hermes-dashboard:%s' "$STATE_PASSWORD" | sha256sum | awk '{print $1}')"

          docker rm -f 9router >/dev/null 2>&1 || true
          docker run -d \
            --name 9router \
            -p 127.0.0.1:${NINEROUTER_PORT}:20128 \
            -v "$LIVE_ROOT/9router:/app/data" \
            -e DATA_DIR=/app/data \
            -e PORT=20128 \
            -e NODE_ENV=production \
            -e JWT_SECRET="$JWT_SECRET" \
            -e INITIAL_PASSWORD="$STATE_PASSWORD" \
            -e API_KEY_SECRET="$API_KEY_SECRET" \
            -e MACHINE_ID_SALT="$MACHINE_ID_SALT" \
            -e REQUIRE_API_KEY=true \
            -e ENABLE_REQUEST_LOGS=false \
            -e OBSERVABILITY_ENABLED=false \
            -e AUTH_COOKIE_SECURE=true \
            -e BASE_URL="http://127.0.0.1:20128" \
            "$NINEROUTER_IMAGE" >/dev/null

          wait_http() {
            local url="$1"; local seconds="${2:-90}"; local i
            for ((i=1; i<=seconds; i++)); do
              if curl -fsS --max-time 3 "$url" >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            echo "ERROR: service did not become ready: $url" >&2
            return 1
          }

          wait_http "http://127.0.0.1:${NINEROUTER_PORT}/api/health" 120
          curl -fsS --max-time 5 "http://127.0.0.1:${NINEROUTER_PORT}/dashboard" >/dev/null

          install_cloudflared() {
            local tmp="$RUNTIME_ROOT/bin/cloudflared.tmp"
            local url="https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
            # Always materialize the exact pinned binary at the path used below.
            # This avoids the preinstalled-PATH vs RUNTIME_ROOT mismatch.
            curl -fsSL "$url" -o "$tmp"
            printf '%s  %s\n' "$CLOUDFLARED_SHA256" "$tmp" | sha256sum -c -
            mv -f "$tmp" "$RUNTIME_ROOT/bin/cloudflared"
            chmod 0755 "$RUNTIME_ROOT/bin/cloudflared"
          }
          install_cloudflared
          CF="$RUNTIME_ROOT/bin/cloudflared"

          start_tunnel() {
            local name="$1"; local target="$2"; local check_path="$3"; local use_auth="${4:-false}"
            local log="$RUNTIME_ROOT/logs/${name}.log"; local pid_file="$RUNTIME_ROOT/cloudflared-${name}.pid"
            : > "$log"
            nohup "$CF" tunnel --no-autoupdate --protocol http2 --url "$target" > "$log" 2>&1 &
            echo $! > "$pid_file"
            local i url
            for ((i=1; i<=120; i++)); do
              if ! kill -0 "$(cat "$pid_file")" 2>/dev/null; then
                echo "ERROR: Cloudflare tunnel process exited for $name" >&2
                tail -n 80 "$log" >&2 || true
                return 1
              fi
              url="$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' "$log" | tail -n1 || true)"
              if [ -n "$url" ]; then
                if [ "$use_auth" = true ]; then
                  if curl -fsS --max-time 8 --user "admin:${STATE_PASSWORD}" "$url$check_path" >/dev/null 2>&1; then
                    echo "$url"
                    return 0
                  fi
                elif curl -fsS --max-time 8 "$url$check_path" >/dev/null 2>&1; then
                  echo "$url"
                  return 0
                fi
              fi
              sleep 1
            done
            echo "ERROR: Cloudflare Quick Tunnel did not become reachable for $name" >&2
            tail -n 100 "$log" >&2 || true
            return 1
          }

          CONTROL_URL="$(start_tunnel control "http://127.0.0.1:${CONTROL_PORT}" "/health")"
          NINEROUTER_URL="$(start_tunnel 9router "http://127.0.0.1:${NINEROUTER_PORT}" "/api/health")"

          setup_complete=false
          if [ -f "$LIVE_ROOT/SETUP_COMPLETE" ]; then
            persisted_key="$(sed -n 's/^NINEROUTER_API_KEY=//p' "$LIVE_ROOT/hermes/.env" 2>/dev/null | tail -n1 || true)"
            case "$persisted_key" in
              ''|*$'\n'*|*$'\r'*|*[[:space:]]*)
                persisted_key=""
                ;;
            esac

            if [ -n "$persisted_key" ] && \
               curl -fsS --max-time 15 \
                 -H "Authorization: Bearer $persisted_key" \
                 -H 'Accept: application/json' \
                 "http://127.0.0.1:${NINEROUTER_PORT}/v1/models" >/dev/null; then
              if ! curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
                   "http://127.0.0.1:${NINEROUTER_PORT}/v1/models" | grep -q '^200$'; then
                setup_complete=true
              else
                echo 'Saved setup exists, but 9Router /v1 is publicly reachable without a key; returning to guided setup.' >&2
              fi
            else
              echo 'Saved 9Router API key is missing or no longer accepted; returning to guided key setup.' >&2
            fi
          fi

          if [ "$setup_complete" != true ]; then
            rm -f "$LIVE_ROOT/SETUP_COMPLETE"
            rm -f "$CONTROL_KEY_VALID" "$CONTROL_KEY" "$CONTROL_CONTINUE"
            printf '%s\n' '9router' > "$CONTROL_STAGE"
            {
              echo '## 9Router setup'
              echo
              echo "- 9Router: $NINEROUTER_URL"
              echo "- Control: $CONTROL_URL"
              echo '- 9Router dashboard password: same value as the GitHub Secret `STATE_PASSWORD`'
              echo '- API Key: create it manually in 9Router Dashboard → Settings → API Keys.'
              echo '- API-key enforcement: in 9Router Dashboard, enable the option that requires a Bearer API key for `/v1` before pressing Continue.'
              echo '- Then paste the API Key into the protected Control page.'
              echo
              echo 'After configuring 9Router, open the Control URL and press **Continue to Hermes setup**.'
            } >> "$GITHUB_STEP_SUMMARY"

            SETUP_END_AT="$(( $(date +%s) + SETUP_TIMEOUT_SECONDS ))"
            while [ ! -f "$CONTROL_KEY_VALID" ]; do
              [ "$(date +%s)" -lt "$SETUP_END_AT" ] || { echo 'ERROR: 9Router API key setup timeout reached.' >&2; exit 1; }
              if ! docker inspect -f '{{.State.Running}}' 9router 2>/dev/null | grep -qx true; then
                echo 'ERROR: 9Router container stopped during setup.' >&2
                docker logs --tail 120 9router >&2 || true
                exit 1
              fi
              sleep 2
            done

            SETUP_END_AT="$(( $(date +%s) + SETUP_TIMEOUT_SECONDS ))"
            while [ ! -f "$CONTROL_CONTINUE" ]; do
              [ "$(date +%s)" -lt "$SETUP_END_AT" ] || { echo 'ERROR: 9Router setup continuation timeout reached.' >&2; exit 1; }
              if ! docker inspect -f '{{.State.Running}}' 9router 2>/dev/null | grep -qx true; then
                echo 'ERROR: 9Router container stopped during setup.' >&2
                docker logs --tail 120 9router >&2 || true
                exit 1
              fi
              sleep 2
            done
            # 9Router setup is complete, but the overall guided setup is NOT complete
            # until the user configures Hermes and presses "Start Hermes Agent" below.
          fi

          # Hermes' official telegram preset is already the full personal-use toolset.
          # Do not rewrite platform_toolsets with `config set`: current Hermes versions
          # can serialize JSON-list values as strings and then resolve the wrong toolset.
          hermes_config_set() {
            local key="$1"
            local value="$2"
            docker run --rm \
              -v "$LIVE_ROOT/hermes:/opt/data" \
              -e HERMES_HOME=/opt/data \
              -e HOME=/opt/data \
              "$HERMES_IMAGE" config set "$key" "$value" >/dev/null
          }

          hermes_config_set 'terminal.backend' 'local'
          hermes_config_set 'terminal.cwd' '/opt/data/workspace'
          hermes_config_set 'terminal.timeout' '180'
          hermes_config_set 'terminal.persistent_shell' 'true'
          # Preflight the pinned Hermes image and verify the official Telegram tool preset is available.
          docker run --rm -v "$LIVE_ROOT/hermes:/opt/data" -e HERMES_HOME=/opt/data -e HOME=/opt/data "$HERMES_IMAGE" --version
          TOOL_OUTPUT="$(docker run --rm -v "$LIVE_ROOT/hermes:/opt/data" -e HERMES_HOME=/opt/data -e HOME=/opt/data "$HERMES_IMAGE" hermes-agent --list-tools 2>&1)" || {
            printf '%s\n' "$TOOL_OUTPUT" >&2
            exit 1
          }
          for required_tool in terminal read_file write_file patch search_files; do
            printf '%s\n' "$TOOL_OUTPUT" | grep -Eq "(^|[^[:alnum:]_])${required_tool}([^[:alnum:]_]|$)" || {
              echo "ERROR: Hermes tool '$required_tool' is not available in the pinned image." >&2
              exit 1
            }
          done

          # The 9Router API key is entered manually in the protected control page on first setup.
          # On later runs it is restored from the encrypted Hermes .env state.
          if [ -s "$CONTROL_KEY_VALID" ] && [ -s "$CONTROL_KEY" ]; then
            NINEROUTER_API_KEY="$(cat "$CONTROL_KEY")"
          else
            NINEROUTER_API_KEY="$(sed -n 's/^NINEROUTER_API_KEY=//p' "$LIVE_ROOT/hermes/.env" 2>/dev/null | tail -n1 || true)"
          fi
          test -n "$NINEROUTER_API_KEY" || { echo 'ERROR: 9Router API key is missing. Run the guided setup and enter it manually.' >&2; exit 1; }
          case "$NINEROUTER_API_KEY" in *$'\n'*|*$'\r'*|*[[:space:]]*) echo 'ERROR: 9Router API key contains whitespace/newlines.' >&2; exit 1;; esac

          curl -fsS --max-time 15 \
            -H "Authorization: Bearer $NINEROUTER_API_KEY" \
            -H 'Accept: application/json' \
            "http://127.0.0.1:${NINEROUTER_PORT}/v1/models" >/dev/null || {
              echo 'ERROR: 9Router API key is not accepted.' >&2
              exit 1
            }

          if curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
               "http://127.0.0.1:${NINEROUTER_PORT}/v1/models" | grep -q '^200$'; then
            echo 'ERROR: 9Router /v1 is reachable without a Bearer key. Enable API-key enforcement in the 9Router Dashboard before continuing.' >&2
            exit 1
          fi

          HERMES_ENV_FILE="$LIVE_ROOT/hermes/.env"
          export NINEROUTER_API_KEY HERMES_ENV_FILE
          python3 - <<'PY'
          import os, pathlib, tempfile
          path = pathlib.Path(os.environ['HERMES_ENV_FILE'])
          secret = os.environ['NINEROUTER_API_KEY']
          existing = path.read_text(encoding='utf-8') if path.exists() else ''
          out=[]
          replaced=False
          for line in existing.splitlines():
              if line.startswith('NINEROUTER_API_KEY='):
                  if not replaced:
                      out.append('NINEROUTER_API_KEY=' + secret)
                      replaced=True
                  continue
              out.append(line)
          if not replaced:
              out.append('NINEROUTER_API_KEY=' + secret)
          data='\n'.join(out).rstrip('\n')+'\n'
          path.parent.mkdir(parents=True, exist_ok=True)
          with tempfile.NamedTemporaryFile('w', encoding='utf-8', dir=path.parent, delete=False) as f:
              f.write(data); f.flush(); os.fsync(f.fileno()); tmp=f.name
          os.chmod(tmp, 0o600)
          os.replace(tmp, path)
          PY
          chmod 600 "$HERMES_ENV_FILE"
          unset NINEROUTER_API_KEY

          # Configure the named custom provider without putting the secret into config.yaml.
          hermes_config_set 'providers.9router.name' '9Router'
          hermes_config_set 'providers.9router.api' "http://127.0.0.1:${NINEROUTER_PORT}/v1"
          hermes_config_set 'providers.9router.key_env' 'NINEROUTER_API_KEY'
          hermes_config_set 'providers.9router.transport' 'chat_completions'
          hermes_config_set 'providers.9router.discover_models' 'true'
          hermes_config_set 'terminal.backend' 'local'
          hermes_config_set 'terminal.cwd' '/opt/data/workspace'
          hermes_config_set 'terminal.timeout' '180'
          hermes_config_set 'terminal.persistent_shell' 'true'
          docker run --rm -v "$LIVE_ROOT/hermes:/opt/data" \
            -e HERMES_HOME=/opt/data -e HOME=/opt/data \
            "$HERMES_IMAGE" config check
          # Hermes runs gateway + supervised dashboard in one container. This avoids
          # split-container state/supervision races while matching the current Docker image.
          docker rm -f hermes-dashboard >/dev/null 2>&1 || true
          docker rm -f hermes-gateway >/dev/null 2>&1 || true
          docker rm -f hermes >/dev/null 2>&1 || true
          HERMES_UID_VALUE="$(id -u)"
          HERMES_GID_VALUE="$(id -g)"

          docker run -d \
            --name hermes \
            --init \
            --shm-size=1g \
            --memory=4g \
            --cpus=2 \
            --network host \
            -v "$LIVE_ROOT/hermes:/opt/data" \
            -e HERMES_UID="$HERMES_UID_VALUE" \
            -e HERMES_GID="$HERMES_GID_VALUE" \
            -e HERMES_HOME=/opt/data \
            -e HOME=/opt/data \
            -e HERMES_WRITE_SAFE_ROOT=/opt/data \
            -e HERMES_DASHBOARD=1 \
            -e HERMES_DASHBOARD_HOST=0.0.0.0 \
            -e HERMES_DASHBOARD_PORT="$HERMES_DASHBOARD_PORT" \
            -e HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin \
            -e HERMES_DASHBOARD_BASIC_AUTH_PASSWORD="$STATE_PASSWORD" \
            -e HERMES_DASHBOARD_BASIC_AUTH_SECRET="$HERMES_AUTH_SECRET" \
            -e TERMINAL_ENV=local \
            -e TERMINAL_LOCAL_PERSISTENT=true \
            -e TERMINAL_CWD=/opt/data/workspace \
            -e TERMINAL_TIMEOUT=180 \
            "$HERMES_IMAGE" gateway run >/dev/null

          wait_http_auth() {
            local url="$1"; local seconds="${2:-120}"; local i
            for ((i=1; i<=seconds; i++)); do
              if curl -fsS --max-time 5 --user "admin:${STATE_PASSWORD}" "$url" >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            echo "ERROR: authenticated service did not become ready: $url" >&2
            return 1
          }

          wait_http_auth "http://127.0.0.1:${HERMES_DASHBOARD_PORT}/api/status" 180
          HERMES_URL="$(start_tunnel hermes "http://127.0.0.1:${HERMES_DASHBOARD_PORT}" "/api/status" true)"

          if [ "$setup_complete" != true ]; then
            printf '%s\n' 'hermes' > "$CONTROL_STAGE"
            {
              echo '## Hermes setup'
              echo
              echo "- Hermes Dashboard: $HERMES_URL"
              echo "- Control: $CONTROL_URL"
              echo '- Dashboard username: `admin`'
              echo '- Dashboard password: same value as the GitHub Secret `STATE_PASSWORD`'
              echo
              echo 'Hermes Telegram با preset رسمی `hermes-telegram` اجرا می‌شود؛ طبق مستندات Hermes این preset شامل toolset کامل Telegram/CLI از جمله file, terminal, web, browser, memory, skills, vision, image_gen, todo, tts, delegation, code_execution, cronjob, session_search, clarify و kanban است.'
              echo '9Router provider: `9router` با API key ذخیره‌شده در `.env` و base URL داخلی `http://127.0.0.1:${NINEROUTER_PORT}/v1`.'
              echo 'Workspace دائمی: `/opt/data/workspace` (برای ساخت/ویرایش/خواندن فایل و اجرای دستورات).'
              echo 'در Hermes مدل/Provider مربوط به **9Router** را انتخاب کنید و Telegram را تنظیم کنید.'
              echo 'بعد از ذخیره تنظیمات، در Control URL روی **Start Hermes Agent** بزنید.'
            } >> "$GITHUB_STEP_SUMMARY"

            SETUP_END_AT="$(( $(date +%s) + SETUP_TIMEOUT_SECONDS ))"
            while [ ! -f "$CONTROL_START" ]; do
              [ "$(date +%s)" -lt "$SETUP_END_AT" ] || { echo 'ERROR: Hermes setup timeout reached.' >&2; exit 1; }
              if ! docker inspect -f '{{.State.Running}}' hermes 2>/dev/null | grep -qx true; then
                echo 'ERROR: Hermes container stopped during setup.' >&2
                docker logs --tail 160 hermes >&2 || true
                exit 1
              fi
              sleep 2
            done
            printf 'completed\n' > "$LIVE_ROOT/SETUP_COMPLETE"
            chmod 600 "$LIVE_ROOT/SETUP_COMPLETE"
            setup_complete=true
          fi

          runtime_end_at="$(( $(date +%s) + TOTAL_MINUTES * 60 ))"
          printf '%s\n' 'running' > "$CONTROL_STAGE"
          {
            echo '## Both services are running'
            echo
            echo "- 9Router: ${NINEROUTER_URL}"
            echo "- Hermes Dashboard: ${HERMES_URL}"
            echo "- Control: ${CONTROL_URL}"
            echo
            echo "The workflow remains alive until the ${TOTAL_MINUTES}-minute limit." 
          } >> "$GITHUB_STEP_SUMMARY"

          while [ "$(date +%s)" -lt "$runtime_end_at" ]; do
            if ! docker inspect -f '{{.State.Running}}' 9router 2>/dev/null | grep -qx true; then
              echo 'ERROR: 9Router container stopped.' >&2
              docker logs --tail 100 9router >&2 || true
              exit 1
            fi
            if ! docker inspect -f '{{.State.Running}}' hermes 2>/dev/null | grep -qx true; then
              echo 'ERROR: Hermes container stopped.' >&2
              docker logs --tail 160 hermes >&2 || true
              exit 1
            fi
            sleep 15
          done

      - name: Stop services and encrypt state
        if: ${{ success() }}
        shell: bash
        run: |
          set -Eeuo pipefail

          docker rm -f hermes-dashboard 2>/dev/null || true
          docker rm -f hermes-gateway 2>/dev/null || true
          docker rm -f hermes 2>/dev/null || true
          docker rm -f 9router 2>/dev/null || true

          if [ -z "${STATE_PASSWORD:-}" ] || [ ! -d "${LIVE_ROOT:-}" ]; then
            echo 'No initialized runtime state to encrypt; skipping state save.'
            exit 0
          fi

          mkdir -p "$CACHE_ROOT"
          tmp_tar="$RUNTIME_ROOT/state-final.tar"
          tmp_enc="$CACHE_ROOT/state.enc.tmp"

          touch "$LIVE_ROOT/STATE_VERSION"
          printf '2\n' > "$LIVE_ROOT/STATE_VERSION"
          chmod 600 "$LIVE_ROOT/STATE_VERSION" "$LIVE_ROOT/SETUP_COMPLETE" 2>/dev/null || true
          tar -cpf "$tmp_tar" -C "$LIVE_ROOT" 9router hermes STATE_VERSION SETUP_COMPLETE 2>/dev/null || tar -cpf "$tmp_tar" -C "$LIVE_ROOT" 9router hermes STATE_VERSION
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$tmp_tar" \
            -out "$tmp_enc" \
            -pass env:STATE_PASSWORD
          mv -f "$tmp_enc" "$CACHE_ROOT/state.enc"
          rm -f "$tmp_tar"

          chmod 600 "$CACHE_ROOT/state.enc"
          echo 'Encrypted runtime state prepared for cache.'

      - name: Save encrypted state cache
        if: ${{ always() && hashFiles('.runtime/cache/state.enc') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .runtime/cache/state.enc
          key: hermes-9router-state-${{ github.repository_id }}-${{ github.run_id }}
